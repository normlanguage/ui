name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    uses: normlanguage/registry/.github/workflows/package.yml@df916befbc6c56aa558a71ba6ae81a0b3dfad17f
    with:
      norm-version: 0.24.0
      runner: windows-2025
