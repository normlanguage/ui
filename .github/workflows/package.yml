name: Package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.23
      - id: package
        uses: normlanguage/registry/.github/actions/package-module@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          module-path: ui
      - name: Verify module and published consumer
        shell: pwsh
        run: |
          $cache = Join-Path $HOME '.norm/cache/packages/github'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item -Path 'build/repository/*' -Destination $cache -Recurse -Force
          norm test ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          norm run samples/state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: normlanguage/registry/.github/actions/publish-module@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          archive: ${{ steps.package.outputs.archive }}
          version: ${{ steps.package.outputs.version }}
